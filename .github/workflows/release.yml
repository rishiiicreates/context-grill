name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: cgrill
            asset_name: cgrill-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: cgrill
            asset_name: cgrill-x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cgrill
            asset_name: cgrill-x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package binary archive
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"

          # Copy binary into dist staging
          cp "${BIN_DIR}/${{ matrix.artifact_name }}" "${DIST_DIR}/${{ matrix.artifact_name }}"
          chmod +x "${DIST_DIR}/${{ matrix.artifact_name }}"

          # Create tar.gz archive
          tar -czf "${DIST_DIR}/${{ matrix.asset_name }}.tar.gz" -C "$DIST_DIR" "${{ matrix.artifact_name }}"
          rm "${DIST_DIR}/${{ matrix.artifact_name }}"

          # Generate sha256 checksum
          cd "$DIST_DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Package Agent Skill ZIP
        shell: bash
        run: |
          # Package SKILL.md and map.md for agent skill registries
          zip -j context-grill-skill.zip SKILL.md map.md
          sha256sum context-grill-skill.zip > context-grill-skill.zip.sha256
          mv context-grill-skill.zip release-assets/
          mv context-grill-skill.zip.sha256 release-assets/

      - name: Display Release Assets
        run: |
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
